<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, touch-action: manipulation" />
<title>水晶手串DIY工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
*{
-webkit-tap-highlight-color: transparent;
box-sizing: border-box;
}
.bead-item{
cursor: grab;
position:relative;
}
.bead-item:active{
cursor: grabbing;
}
.del-mat-btn{
position:absolute;
top:2px;
right:2px;
width:24px;
height:24px;
background:#ef4444;
color:#fff;
border-radius:50%;
font-size:14px;
display:flex;
align-items:center;
justify-content:center;
z-index:20;
pointer-events:auto !important;
}
canvas{
display:block;
border:1px solid #e5e7eb;
border-radius:8px;
width:100%;
height:auto !important;
touch-action: manipulation;
}
::-webkit-scrollbar{
width:6px;
height:6px;
}
::-webkit-scrollbar-thumb{
background:#cccccc;
border-radius:4px;
}
.tab-active{
background-color:#3b82f6;
color:#fff;
}
.wuxing-tag{
font-size:10px;
padding:1px 4px;
border-radius:3px;
color:#fff;
}
.tag-jin{background:#94a3b8;}
.tag-mu{background:#22c55e;}
.tag-shui{background:#3b82f6;}
.tag-huo{background:#ef4444;}
.tag-tu{background:#eab308;}
.material-card{
font-size:11px;
}
/* 折叠面板通用样式 */
.collapse-header{
cursor:pointer;
user-select:none;
display:flex;
justify-content:space-between;
align-items:center;
min-height:48px;
}
.collapse-body{
overflow:hidden;
transition:max-height 0.25s ease;
}
/* 加大移动端按钮点击区域，强制可点击 */
button{
min-height:48px;
pointer-events:auto !important;
cursor:pointer;
}
input[type=range]{
min-height:40px;
}
.del-tab-btn{
pointer-events:auto !important;
z-index:15;
cursor:pointer;
}
</style>
</head>
<body class="bg-neutral-100 min-h-screen">
<div class="max-w-7xl mx-auto p-2 md:p-4">
  <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
    <h2 class="text-lg md:text-2xl font-bold">水晶手串DIY工具</h2>
    <div class="flex gap-2">
      <button onclick="undoAction()" class="bg-slate-600 text-white px-3 py-2 rounded text-sm">↩撤销</button>
      <button onclick="redoAction()" class="bg-slate-600 text-white px-3 py-2 rounded text-sm">↪重做</button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[2.4fr_1fr] gap-3 md:gap-4">
    <!-- ========= PC左侧：画布主栏 ========= -->
    <div class="bg-white rounded-xl shadow p-3 order-1 flex flex-col items-center">
      <div class="w-full mb-3 flex flex-wrap gap-2 items-center justify-between text-sm">
        <span>画布设置</span>
        <div class="flex gap-2 items-center flex-wrap">
          <label class="flex items-center gap-1 whitespace-nowrap">
            <input type="checkbox" id="autoCanvasMode" checked>自适应窗口
          </label>
          <label class="whitespace-nowrap">宽:<input id="canvasWInput" class="w-14 border rounded px-1 py-0.5 text-center text-sm" type="number" min="300" max="1200" value="640"></label>
          <label class="whitespace-nowrap">高:<input id="canvasHInput" class="w-14 border rounded px-1 py-0.5 text-center text-sm" type="number" min="300" max="1200" value="640"></label>
          <button onclick="resizeCanvas()" class="bg-blue-500 text-white px-2 py-1 rounded text-sm">应用</button>
        </div>
      </div>
      <div id="canvasWrap" class="w-full">
        <canvas id="canvas" width="640" height="640"></canvas>
      </div>

      <!-- 素材库分组 -->
      <div class="w-full mt-3 border rounded-lg overflow-hidden">
        <div class="collapse-header bg-gray-50 p-2 font-semibold text-sm" onclick="toggleMaterialPanel()">
          <span>素材库分组</span>
          <span id="materialPanelArrow">▼</span>
        </div>
        <div id="materialPanel" class="collapse-body" style="max-height:0px;">
          <div class="p-2">
            <div class="flex justify-between items-center mb-2">
              <button onclick="addGroup()" class="bg-green-500 text-white px-2 py-2 rounded text-sm">+新增分组</button>
            </div>
            <div id="groupTabWrap" class="flex flex-wrap gap-1 mb-2 max-h-[80px] overflow-y-auto"></div>

            <input id="materialSearch" placeholder="🔍搜索素材名称" class="w-full border rounded px-2 py-2 text-sm mb-2" oninput="renderMaterial()">

            <div class="flex gap-2 mb-2 flex-wrap">
              <label class="bg-blue-500 text-white px-2 py-2 rounded-lg cursor-pointer text-sm flex-1 text-center">
                📤单图上传
                <input type="file" id="uploadImg" accept="image/png,image/jpg,image/webp" class="hidden">
              </label>
              <label class="bg-indigo-500 text-white px-2 py-2 rounded-lg cursor-pointer text-sm flex-1 text-center">
                📦批量导入
                <input type="file" id="batchUploadImg" accept="image/png,image/jpg,image/webp" multiple class="hidden">
              </label>
            </div>

            <div class="mb-2">
              <label class="text-sm block mb-1">素材缩略图大小：</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="thumbSizeRange" min="40" max="100" value="64" class="flex-1">
                <input type="number" step="0.1" min="40" max="100" id="thumbSizeInput" value="64" class="w-16 border rounded text-center py-1 text-sm">
              </div>
            </div>

            <div class="flex gap-2 mb-3 flex-wrap">
              <button onclick="exportMaterialPack()" class="bg-sky-500 text-white px-2 py-2 rounded text-sm flex-1">导出素材包</button>
              <label class="bg-emerald-500 text-white px-2 py-2 rounded text-sm cursor-pointer flex-1 text-center">
                导入素材包
                <input type="file" id="importMaterialFile" accept=".json" class="hidden">
              </label>
            </div>
            <div id="materialList" class="grid grid-cols-3 gap-2 max-h-[240px] overflow-y-auto"></div>
            <p class="text-xs text-gray-400 mt-2">点击添加珠子｜长按素材：编辑信息｜点×删除素材</p>
          </div>
        </div>
      </div>

      <!-- 价格 & 五行统计 -->
      <div class="w-full mt-3 border rounded-lg overflow-hidden">
        <div class="collapse-header bg-gray-50 p-2 font-semibold text-sm" onclick="togglePriceChartPanel()">
          <span>价格 & 五行统计</span>
          <span id="priceChartArrow">▲</span>
        </div>
        <div id="priceChartPanel" class="collapse-body" style="max-height:220px;">
          <div class="p-2">
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold text-sm">手串预估总价：<span id="totalPrice" class="text-red-500 text-lg">0.0</span> 元</span>
              <span class="text-sm">珠子总数：<span id="beadCount">0</span> 颗</span>
            </div>
            <div style="height:110px;">
              <canvas id="wuxingChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 mt-3 justify-center">
        <button onclick="exportImg()" class="bg-green-500 text-white px-3 py-2 rounded-lg text-sm">💾 导出图片</button>
        <button onclick="clearAllBeads()" class="bg-red-400 text-white px-3 py-2 rounded-lg text-sm">🗑️ 清空手串</button>
        <button onclick="batchRotateAll()" class="bg-orange-500 text-white px-3 py-2 rounded-lg text-sm">🔄批量旋转</button>
      </div>
      <p class="text-xs text-gray-400 mt-2">拖动珠子调换顺序；选中珠子可镜像、调角度尺寸</p>
    </div>

    <!-- PC右侧参数栏 -->
    <div class="bg-white rounded-xl shadow p-3 order-2 flex flex-col gap-3">
      <!-- 选中珠子单独调节 -->
      <div class="border rounded-lg overflow-hidden">
        <div class="collapse-header p-2 font-bold" onclick="toggleSelectBeadPanel()">
          <h3 class="text-base">选中珠子单独调节</h3>
          <span id="selectBeadArrow">▲</span>
        </div>
        <div id="selectBeadPanel" class="collapse-body" style="max-height:1600px;">
          <div class="p-2 pt-0">
            <div id="selectTip" class="text-xs text-orange-500 mb-2">请先点击画布上的珠子选中</div>
            <div class="mb-3">
              <label class="text-sm block mb-1">单颗珠子尺寸(mm)</label>
              <div class="flex gap-2 items-center">
                <input disabled type="range" id="singleBeadSize" min="20" max="80" step="0.1" value="44" class="flex-1">
                <input disabled type="number" step="0.1" min="20" max="80" id="singleBeadSizeInput" value="44.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="mb-3">
              <label class="text-sm block mb-1">珠子旋转角度(°)</label>
              <div class="flex gap-2 items-center">
                <input disabled type="range" id="beadRotateSlider" min="0" max="360" step="0.1" value="0" class="flex-1">
                <input disabled type="number" step="0.1" min="0" max="360" id="beadRotateInput" value="0.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="flex gap-2 flex-wrap mb-2">
              <button onclick="flipHorizontal()" class="bg-violet-500 text-white px-2 py-2 rounded text-sm flex-1">↔水平镜像</button>
              <button onclick="openReplacePanel()" class="bg-blue-500 text-white px-2 py-2 rounded text-sm flex-1">替换素材</button>
              <button onclick="removeSelectedBead()" class="bg-red-400 text-white px-2 py-2 rounded text-sm flex-1">删除珠子</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 全局参数 -->
      <div class="border rounded-lg overflow-hidden">
        <div class="collapse-header p-2 font-bold" onclick="toggleGlobalPanel()">
          <h3 class="text-base">全局参数</h3>
          <span id="globalPanelArrow">▼</span>
        </div>
        <div id="globalParamPanel" class="collapse-body" style="max-height:0px;">
          <div class="p-2 pt-0">
            <div class="mb-3">
              <label class="text-sm block mb-1">手串圆环半径(mm)</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="ringRadius" min="140" max="260" step="0.1" value="210" class="flex-1">
                <input type="number" step="0.1" min="140" max="260" id="ringRadiusInput" value="210.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="mb-3">
              <label class="text-sm block mb-1">默认珠子尺寸(mm)</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="beadSize" min="20" max="66" step="0.1" value="44" class="flex-1">
                <input type="number" step="0.1" min="20" max="66" id="beadSizeInput" value="44.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="mb-3">
              <label class="text-sm block mb-1">手串开口角度(°)</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="gapAngle" min="0" max="120" step="0.1" value="60" class="flex-1">
                <input type="number" step="0.1" min="0" max="120" id="gapAngleInput" value="60.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="mb-3">
              <label class="text-sm block mb-1">珠子透明度(%)</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="beadOpacity" min="30" max="100" step="0.1" value="92" class="flex-1">
                <input type="number" step="0.1" min="30" max="100" id="beadOpacityInput" value="92.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>
            <div class="mb-3">
              <label class="text-sm block mb-1">阴影强度</label>
              <div class="flex gap-2 items-center">
                <input type="range" id="shadowLevel" min="0" max="15" step="0.1" value="6" class="flex-1">
                <input type="number" step="0.1" min="0" max="15" id="shadowLevelInput" value="6.0" class="w-16 border rounded text-center py-1">
              </div>
            </div>

            <div class="mb-4">
              <label class="text-sm block mb-1">画布背景色</label>
              <input type="color" id="bgColorPicker" value="#ffffff" class="w-full h-9">
              <div class="flex gap-2 mt-2">
                <button onclick="setBg('#ffffff')" class="w-8 h-8 bg-white border rounded"></button>
                <button onclick="setBg('#f3f4f6')" class="w-8 h-8 bg-gray-100 border rounded"></button>
                <button onclick="setBg('#1f2937')" class="w-8 h-8 bg-gray-800 border rounded"></button>
                <button onclick="setBg('#000000')" class="w-8 h-8 bg-black border rounded"></button>
              </div>
            </div>
            <div class="border-t mt-4 pt-3">
              <h4 class="text-sm font-semibold mb-2">备份说明</h4>
              <ul class="text-xs text-gray-500 space-y-1">
                <li>📦素材包：包含名称、价格、五行、颜色、尺寸标签</li>
                <li>📋方案包：保存珠子角度、镜像、尺寸信息</li>
                <li>⚠️清理浏览器缓存会丢失本地数据</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- 手串方案管理 -->
      <div class="border rounded-lg overflow-hidden">
        <div class="collapse-header p-2 font-bold" onclick="toggleSchemePanel()">
          <h3 class="text-base">手串方案管理</h3>
          <span id="schemePanelArrow">▼</span>
        </div>
        <div id="schemePanel" class="collapse-body" style="max-height:0px;">
          <div class="p-2 pt-0">
            <div class="flex gap-2 mb-2 flex-wrap">
              <button onclick="saveScheme()" class="bg-sky-500 text-white px-2 py-2 rounded text-sm flex-1">保存方案</button>
              <button onclick="exportSchemePack()" class="bg-amber-500 text-white px-2 py-2 rounded text-sm flex-1">导出方案</button>
            </div>
            <div class="flex gap-2 mb-2 flex-wrap">
              <label class="bg-teal-500 text-white px-2 py-2 rounded text-sm cursor-pointer flex-1 text-center">
                导入方案
                <input type="file" id="importSchemeFile" accept=".json" class="hidden">
              </label>
              <button onclick="clearSchemeList()" class="bg-gray-400 text-white px-2 py-2 rounded text-sm flex-1">清空方案</button>
            </div>
            <div id="schemeList" class="max-h-[120px] overflow-y-auto text-xs space-y-1"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div id="editMaterialPanel" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-xl p-4 w-full max-w-[340px]">
    <h4 class="font-bold mb-3">编辑素材信息</h4>
    <div class="mb-2">
      <label class="text-sm block">素材名称</label>
      <input id="editMatName" class="w-full border rounded px-2 py-2">
    </div>
    <div class="mb-2">
      <label class="text-sm block">单价(元)</label>
      <input type="number" step="0.1" min="0" id="editMatPrice" class="w-full border rounded px-2 py-2">
    </div>
    <div class="mb-2">
      <label class="text-sm block">颜色标签</label>
      <input id="editMatColor" class="w-full border rounded px-2 py-2" placeholder="例如：酒红、紫、白">
    </div>
    <div class="mb-2">
      <label class="text-sm block">尺寸标签(mm)</label>
      <input id="editMatSizeTag" class="w-full border rounded px-2 py-2" placeholder="例如：8、10">
    </div>
    <div class="mb-3">
      <label class="text-sm block">五行属性</label>
      <select id="editMatWuxing" class="w-full border rounded px-2 py-2">
        <option value="">无</option>
        <option value="金">金</option>
        <option value="木">木</option>
        <option value="水">水</option>
        <option value="火">火</option>
        <option value="土">土</option>
      </select>
    </div>
    <div class="flex gap-2">
      <button onclick="saveMaterialEdit()" class="flex-1 bg-blue-500 text-white py-2 rounded-lg">保存</button>
      <button onclick="closeEditMaterialPanel()" class="flex-1 bg-gray-300 py-2 rounded-lg">取消</button>
    </div>
  </div>
</div>

<div id="batchRotatePanel" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-xl p-4 w-full max-w-[300px]">
    <h4 class="font-bold mb-3">批量统一旋转所有珠子</h4>
    <label class="text-sm block mb-1">旋转角度 °</label>
    <input type="number" step="0.1" id="batchRotateDeg" value="0" class="w-full border rounded px-2 py-2 mb-3">
    <div class="flex gap-2">
      <button onclick="confirmBatchRotate()" class="flex-1 bg-orange-500 text-white py-2 rounded-lg">确认应用</button>
      <button onclick="closeBatchRotatePanel()" class="flex-1 bg-gray-300 py-2 rounded-lg">取消</button>
    </div>
  </div>
</div>

<div id="replacePanel" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-3">
  <div class="bg-white rounded-xl p-4 w-full max-w-[340px]">
    <h4 class="font-bold mb-3">选择素材替换当前珠子</h4>
    <div id="replaceMaterialWrap" class="grid grid-cols-4 gap-2 max-h-[260px] overflow-y-auto mb-3"></div>
    <button onclick="closeReplacePanel()" class="w-full bg-gray-300 py-2 rounded-lg">取消</button>
  </div>
</div>

<script>
// =========全部折叠面板状态变量=========
let globalPanelExpand = false;
let materialPanelExpand = false;
let selectBeadPanelExpand = true;
let priceChartPanelExpand = true;
let schemePanelExpand = false;

function toggleGlobalPanel(){
  globalPanelExpand = !globalPanelExpand;
  const panel = document.getElementById('globalParamPanel');
  const arrow = document.getElementById('globalPanelArrow');
  if(globalPanelExpand){
    panel.style.maxHeight = "1600px";
    arrow.innerText = "▲";
  }else{
    panel.style.maxHeight = "0px";
    arrow.innerText = "▼";
  }
}
function toggleMaterialPanel(){
  materialPanelExpand = !materialPanelExpand;
  const panel = document.getElementById('materialPanel');
  const arrow = document.getElementById('materialPanelArrow');
  if(materialPanelExpand){
    panel.style.maxHeight = "1600px";
    arrow.innerText = "▲";
  }else{
    panel.style.maxHeight = "0px";
    arrow.innerText = "▼";
  }
}
function toggleSelectBeadPanel(){
  selectBeadPanelExpand = !selectBeadPanelExpand;
  const panel = document.getElementById('selectBeadPanel');
  const arrow = document.getElementById('selectBeadArrow');
  if(selectBeadPanelExpand){
    panel.style.maxHeight = "1600px";
    arrow.innerText = "▲";
  }else{
    panel.style.maxHeight = "0px";
    arrow.innerText = "▼";
  }
}
function togglePriceChartPanel(){
  priceChartPanelExpand = !priceChartPanelExpand;
  const panel = document.getElementById('priceChartPanel');
  const arrow = document.getElementById('priceChartArrow');
  if(priceChartPanelExpand){
    panel.style.maxHeight = "220px";
    arrow.innerText = "▲";
  }else{
    panel.style.maxHeight = "0px";
    arrow.innerText = "▼";
  }
}
function toggleSchemePanel(){
  schemePanelExpand = !schemePanelExpand;
  const panel = document.getElementById('schemePanel');
  const arrow = document.getElementById('schemePanelArrow');
  if(schemePanelExpand){
    panel.style.maxHeight = "1600px";
    arrow.innerText = "▲";
  }else{
    panel.style.maxHeight = "0px";
    arrow.innerText = "▼";
  }
}

// ==========【画布初始化｜移动端触屏重大修复】==========
const canvas = new fabric.Canvas('canvas', {
  preserveObjectStacking: true,
  touchSupport: true,
  allowTouchScrolling:true,
  stopTouchPropagation: false, //关键修复：不阻断页面其他元素触摸事件
  selection: true,
  targetFindTolerance: 38, //加大触屏点击容错
  perPixelTargetFind: false
});
//修复 fabric5.x touchcancel 锁死触摸bug（苹果Safari核心问题）
canvas.on('touchcancel',()=>{ canvas._mainTouchId = null; });
//兜底手动拾取珠子：原生选择失败时自己遍历
canvas.on('mouse:down', function(opt){
  if(opt.target) return;
  const pointer = canvas.getPointer(opt.e);
  //倒序，选最上层珠子
  const found = [...beadList].reverse().find(bead=> bead.containsPoint(pointer));
  if(found){
    canvas.setActiveObject(found);
    selectedBead = found;
    canvas.renderAll();
    updateSingleSizeUI();
  }
});

let canvasW = 640;
let canvasH = 640;
let CENTER_X = canvasW / 2;
let CENTER_Y = canvasH / 2;
let autoCanvasMode = true;

let wuxingChart;
function initChart(){
  const ctx = document.getElementById('wuxingChart').getContext('2d');
  wuxingChart = new Chart(ctx,{
    type:'bar',
    data:{
      labels:['金','木','水','火','土','无属性'],
      datasets:[{
        label:'珠子数量',
        data:[0,0,0,0,0,0],
        backgroundColor:['#94a3b8','#22c55e','#3b82f6','#ef4444','#eab308','#9ca3af']
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}
    }
  });
}

function updatePriceAndWuxingStat(){
  let total = 0;
  const stat = {jin:0,mu:0,shui:0,huo:0,tu:0,none:0};
  beadList.forEach(bead=>{
    const mat = bead.materialData;
    if(!mat){
      stat.none++;
      return;
    }
    const price = Number(mat.price||0);
    total += price;
    const wx = mat.wuxing;
    if(wx==='金')stat.jin++;
    else if(wx==='木')stat.mu++;

// 撤销重做
let historyStack = [];
let historyIndex = -1;
const HISTORY_MAX = 60;
function saveHistory(){
  historyStack.splice(historyIndex+1);
  const snapshot = beadList.map(item=>{
    return {
      src:item._element.src,
      scale:item.scaleX,
      opacity:item.opacity,
      angle:item.angle,
      flipX:item.flipX,
      materialData:item.materialData
    };
  });
  historyStack.push(JSON.parse(JSON.stringify(snapshot)));
  if(historyStack.length>HISTORY_MAX) historyStack.shift();
  else historyIndex++;
}
function undoAction(){
  if(historyIndex<=0) return alert("无法撤销");
  historyIndex--;
  loadSnapshot(historyStack[historyIndex]);
}
function redoAction(){
  if(historyIndex >= historyStack.length-1) return alert("无法重做");
  historyIndex++;
  loadSnapshot(historyStack[historyIndex]);
}
function loadSnapshot(snap){
  beadList.forEach(b=>canvas.remove(b));
  beadList=[];
  selectedBead=null;
  canvas.discardActiveObject();
  snap.forEach(info=>{
    const opacity = +document.getElementById('beadOpacity').value / 100;
    const shadowVal = +document.getElementById('shadowLevel').value;
    fabric.Image.fromURL(info.src, oImg=>{
      oImg.scaleToWidth(44);
      oImg.scale(info.scale||1);
      oImg.set({
        hasControls:false,
        selectable:true,
        evented:true,
        opacity:info.opacity ?? opacity,
        angle:info.angle ?? 0,
        flipX:!!info.flipX,
        shadow: shadowVal>0 ? new fabric.Shadow({color:'rgba(120,120,120,0.3)', blur:shadowVal}) : null
      });
      oImg.materialData = info.materialData || null;
      beadList.push(oImg);
      canvas.add(oImg);
      updateBeadPosition();
      updateSingleSizeUI();
      updatePriceAndWuxingStat();
    });
  });
}

function renderMaterial() {
  const keyword = document.getElementById("materialSearch").value.trim().toLowerCase();
  const wrap = document.getElementById('materialList');
  wrap.innerHTML = '';
  const list = groupData.materials[currentGroup] || [];
  list.forEach((matObj, idx) => {
    if(typeof matObj === "string"){
      matObj = {src:matObj, name:"素材"+(idx+1), price:0, wuxing:"",color:"",sizeTag:""};
      list[idx] = matObj; saveGroupStorage();
    }
    if(keyword && !matObj.name.toLowerCase().includes(keyword)) return;
    const div = document.createElement('div');
    div.className = "bead-item border rounded p-1 bg-gray-50 material-card";
    const wxClass = matObj.wuxing ? `wuxing-tag tag-${matObj.wuxing}` : '';
    let tagLine=[];
    if(matObj.color) tagLine.push(matObj.color);
    if(matObj.sizeTag) tagLine.push(matObj.sizeTag+"mm");
    const tagText=tagLine.join(" ");
    div.innerHTML = `
      <div class="del-mat-btn" data-mat-idx="${idx}">×</div>
      <img src="${matObj.src}" style="width:${thumbSize}px;height:${thumbSize}px;object-contain;margin:0 auto;display:block;">
      <div class="mt-1 text-center truncate">${matObj.name}</div>
      <div class="text-center text-gray-500">${tagText}</div>
      <div class="flex justify-between items-center mt-0.5">
        <span>¥${Number(matObj.price||0).toFixed(1)}</span>
        ${matObj.wuxing ? `<span class="${wxClass}">${matObj.wuxing}</span>`:''}
      </div>
    `;
    //修复：把长按计时器放到子元素判断，删除按钮优先捕获事件
    let pressTimer;
    div.onclick = (e)=>{
      if(e.target.classList.contains('del-mat-btn')) return;
      addBead(matObj);
    };
    div.ontouchstart = (e)=>{
      if(e.target.classList.contains('del-mat-btn')) return;
      pressTimer = setTimeout(()=>{
        editMaterialIndex = idx;
        editMaterialGroup = currentGroup;
        openEditMaterialPanel(matObj);
      },600);
    };
    div.ontouchend = div.ontouchcancel = ()=>{
      clearTimeout(pressTimer);
    };
    div.onmousedown = (e)=>{
      if(e.target.classList.contains('del-mat-btn')) return;
      pressTimer = setTimeout(()=>{
        editMaterialIndex = idx;
        editMaterialGroup = currentGroup;
        openEditMaterialPanel(matObj);
      },600);
    };
    div.onmouseup = div.onmouseleave = ()=>clearTimeout(pressTimer);
    wrap.appendChild(div);
  });

  document.querySelectorAll('.del-mat-btn').forEach(btn=>{
    btn.onclick=(ev)=>{

      if(!confirm("确定删除这条素材？"))return;
      groupData.materials[currentGroup].splice(idx,1);

      renderMaterial();

function replaceBeadMaterial(matObj){
  if(!selectedBead) return;saveHistory();
  const oldScale = selectedBead.scaleX;
  const oldOpacity = selectedBead.opacity;
  const oldShadow = selectedBead.shadow;
  const oldAngle = selectedBead.angle;
  const oldFlip = selectedBead.flipX;
  fabric.Image.fromURL(matObj.src,newImg=>{
    newImg.scaleToWidth(44);newImg.scale(oldScale);
    newImg.set({
      left:selectedBead.left,
      top:selectedBead.top,
      hasControls:false,
      selectable:true,
      evented:true,
      opacity:oldOpacity,
      shadow:oldShadow,
      angle:oldAngle,
      flipX:oldFlip
    });
    newImg.materialData = {...matObj};
    const idx = beadList.indexOf(selectedBead);beadList[idx]=newImg;
    canvas.remove(selectedBead);canvas.add(newImg);selectedBead=newImg;
    closeReplacePanel();canvas.renderAll();updateSingleSizeUI();updatePriceAndWuxingStat();
  },{crossOrigin:'anonymous'});
}

function updateBeadPosition() {
  const r = parseFloat(document.getElementById('ringRadius').value);
  const gap = parseFloat(document.getElementById('gapAngle').value);
  const count = beadList.length;
  if (count === 0) return;
  const startRad = fabric.util.degreesToRadians(180 + gap / 2);
  const endRad = fabric.util.degreesToRadians(360 + 180 - gap / 2);
  const step = (endRad - startRad) / (count - 1);
  beadList.forEach((bead, i) => {
    const angle = startRad + step * i;
    bead.set({
      left: CENTER_X + r * Math.cos(angle) - bead.getScaledWidth() / 2,
      top: CENTER_Y + r * Math.sin(angle) - bead.getScaledHeight() / 2
    });
    bead.setCoords();
  });
  canvas.renderAll();
}

function updateSingleSizeUI(){
  const slider = document.getElementById("singleBeadSize");

  const rotSlider = document.getElementById("beadRotateSlider");
  const rotInp = document.getElementById("beadRotateInput");
  const tipDom = document.getElementById("selectTip");

  const activeObj = canvas.getActiveObject();
  if(!activeObj || !beadList.includes(activeObj)){
    selectedBead = null;
    slider.disabled = true;
    inp.disabled=true;
    rotSlider.disabled=true;
    rotInp.disabled=true;
    tipDom.innerText = "请先点击画布上的珠子选中";
    return;
  }

  selectedBead = activeObj;
  slider.disabled = false;
  inp.disabled=false;
  rotSlider.disabled=false;
  rotInp.disabled=false;

  const w = selectedBead.getScaledWidth();
  slider.value = w;
  inp.value = w.toFixed(1);
  rotSlider.value = selectedBead.angle;
  rotInp.value = selectedBead.angle.toFixed(1);
  tipDom.innerText = "✅已选中珠子｜支持镜像、旋转、单独调尺寸";
}

  canvas.remove(selectedBead);
  beadList.splice(idx,1);
  selectedBead=null;
  canvas.discardActiveObject();
  canvas.renderAll();
  updateBeadPosition();
  updateSingleSizeUI();
  updatePriceAndWuxingStat();
}

function saveScheme(){
  const snap=beadList.map(item=>{
    return {
      src:item._element.src,
      scale:item.scaleX,
      opacity:item.opacity,
      angle:item.angle,
      flipX:item.flipX,
      materialData:item.materialData
    };
  });
  schemeList.push(snap);
  localStorage.setItem('crystalSchemeList',JSON.stringify(schemeList));
  renderSchemeList();
  alert("方案已保存");
}
function loadScheme(idx){
  saveHistory();
  loadSnapshot(schemeList[idx]);
}
function delScheme(idx){
  if(!confirm("删除这条方案？"))return;
  schemeList.splice(idx,1);
  localStorage.setItem('crystalSchemeList',JSON.stringify(schemeList));
  renderSchemeList();
}
function clearSchemeList(){
  if(!confirm("清空所有本地保存方案？"))return;
  schemeList=[];
  localStorage.setItem('crystalSchemeList',JSON.stringify(schemeList));
  renderSchemeList();
}

function exportImg(){
  const url=canvas.toDataURL({format:'png',quality:0.92});
  const a=document.createElement('a');
  a.href=url;
  a.download="手串预览.png";
  a.click();
}

//初始化
window.onload=function(){
  initChart();
  renderGroupTabs();
  renderMaterial();
  renderSchemeList();
  resizeCanvas();
  //全局参数滑块初始同步输入框
  document.getElementById('beadSizeInput').value=parseFloat(document.getElementById('beadSize').value).toFixed(1);
  document.getElementById('ringRadiusInput').value=parseFloat(document.getElementById('ringRadius').value).toFixed(1);
  document.getElementById('gapAngleInput').value=parseFloat(document.getElementById('gapAngle').value).toFixed(1);
  document.getElementById('beadOpacityInput').value=parseFloat(document.getElementById('beadOpacity').value).toFixed(1);
  document.getElementById('shadowLevelInput').value=parseFloat(document.getElementById('shadowLevel').value).toFixed(1);
}
</script>
